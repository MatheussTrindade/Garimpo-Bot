[project]
name = "garimpo-bot"
version = "0.1.0"
description = "Garimpo de vulnerabilidades e ameaças (CISA KEV, NVD, EPSS) com alertas priorizados no Telegram."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matheus Trindade" }]
requires-python = ">=3.12"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # flake8-bandit (segurança)
  "SIM",           # simplificações
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert é permitido em testes

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
